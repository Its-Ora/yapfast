# Fork: builds Windows on every push to main (or on demand) and publishes it
# as the latest GitHub Release, so the newest build is always on the
# Releases page. The same cross-build as the Nightly workflow's.
name: Ora Windows build

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ora-windows-${{ github.ref }}
  cancel-in-progress: true

jobs:
  windows:
    runs-on: ubuntu-latest
    timeout-minutes: 240
    outputs:
      version: ${{ steps.version.outputs.version }}
    steps:
      - name: Free disk space
        run: sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL
      - uses: actions/checkout@v5
      - id: version
        run: |
          current=$(sed -n 's/^version = "\(.*\)"$/\1/p' Cargo.toml | head -1)
          echo "version=${current%%-*}-ora.$GITHUB_RUN_NUMBER" >> "$GITHUB_OUTPUT"
      - uses: cachix/install-nix-action@v31
        with:
          github_access_token: ${{ github.token }}
      - uses: actions/cache@v4
        with:
          path: |
            ~/.cache/cargo-xwin
            .local/windows/skia-static-production/build.json
            .local/windows/skia-static-production/prepared
          key: windows-skia-${{ hashFiles('nix/flake.lock', 'nix/prepare-windows-skia.py', 'nix/prepare-skia-native.py', 'nix/skia-windows-builder/**') }}
      - uses: Swatinem/rust-cache@v2
        with:
          cache-on-failure: true
      - run: scripts/set-version "${{ steps.version.outputs.version }}"
      # Wine doesn't start on the runner, so there is no installer: the
      # portable ZIP only.
      - run: nix develop path:./nix#windows --command scripts/build-windows discord --no-installer
      - uses: actions/upload-artifact@v4
        with:
          name: windows
          path: target/dist/discord/Yapfast-*
          if-no-files-found: error
          compression-level: 0

  release:
    needs: windows
    runs-on: ubuntu-latest
    permissions:
      contents: write
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
      VERSION: ${{ needs.windows.outputs.version }}
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: windows
          path: dist
      - name: Publish
        run: |
          set -o pipefail
          mkdir release
          mv dist/Yapfast-*-windows-x64* release/
          (cd release && sha256sum Yapfast-* > SHA256SUMS.txt)
          tag="ora-$GITHUB_RUN_NUMBER"
          gh release create "$tag" release/* --latest --target "$GITHUB_SHA" \
            --title "Yapfast Ora $VERSION (${GITHUB_SHA:0:7})" \
            --notes "Build Windows du fork Its-Ora à ${GITHUB_SHA}. Télécharge le ZIP, extrais-le et lance yapfast.exe."
